<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up | Scam Shield</title>
<style>
:root { --bg: #081124; --card: #101d39; --line: #345b91; --muted: #9aacca; --cyan: #67f0e2; --blue: #367fe9; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; color: #fff; font-family: "Aptos Display", "Trebuchet MS", sans-serif; background: radial-gradient(circle at 15% 10%, rgba(30, 200, 212, .2), transparent 25rem), radial-gradient(circle at 85% 90%, rgba(79, 131, 255, .18), transparent 24rem), var(--bg); }
.auth-card { width: min(100%, 620px); padding: clamp(24px, 5vw, 42px); border: 1px solid var(--line); border-radius: 24px; background: linear-gradient(145deg, rgba(20, 38, 72, .98), rgba(10, 20, 45, .98)); box-shadow: 0 28px 80px rgba(0,0,0,.4); }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
.brand-mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; color: #061019; background: linear-gradient(145deg, var(--cyan), var(--blue)); font-size: 24px; font-weight: bold; }
.brand strong { font-size: 23px; }
.brand small { display: block; margin-top: 3px; color: #8fa9c7; font-size: 11px; }
h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 40px); letter-spacing: -1px; }
.intro { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
.form { display: grid; gap: 15px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.full { grid-column: 1 / -1; }
label { display: grid; gap: 7px; color: #cbd8eb; font-size: 12px; font-weight: bold; }
input, select { width: 100%; padding: 13px; border: 1px solid #345276; border-radius: 9px; color: #fff; background: #09152d; font: inherit; }
input:focus, select:focus { outline: 2px solid var(--cyan); border-color: transparent; }
button { padding: 13px; border: 0; border-radius: 10px; color: #fff; background: linear-gradient(135deg, #16bfc8, var(--blue)); font: inherit; font-weight: bold; cursor: pointer; }
button:hover { filter: brightness(1.12); }
.message { display: none; padding: 12px; border-radius: 9px; color: #ffd98e; background: #49331a; font-size: 13px; line-height: 1.4; }
.message.visible { display: block; }
.switch { margin: 22px 0 0; color: var(--muted); text-align: center; font-size: 13px; }
a { color: var(--cyan); font-weight: bold; text-decoration: none; }
a:hover { text-decoration: underline; }
.note { margin: 22px 0 0; color: #7189a8; font-size: 11px; line-height: 1.5; text-align: center; }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } .full { grid-column: auto; } }
</style>
</head>
<body>
<main class="auth-card">
    <div class="brand"><div class="brand-mark">✓</div><div><strong>Scam Shield</strong><small>Private scam protection</small></div></div>
    <h1>Create your account</h1>
    <p class="intro">Set up your personal protection workspace and start checking suspicious activity.</p>
    <form class="form" id="signup-form">
        <div class="grid">
            <label>Full name<input id="name" type="text" autocomplete="name" placeholder="Your name" required></label>
            <label>Age<input id="age" type="number" min="13" max="120" placeholder="18" required></label>
            <label>Mobile number<input id="mobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="+1 555 123 4567" required></label>
            <label>Gender<select id="gender" required><option value="" selected disabled>Select</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Prefer not to say</option></select></label>
            <label class="full">Address<input id="address" type="text" autocomplete="street-address" placeholder="Your address" required></label>
            <label class="full">Email<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
            <label class="full">Create password<input id="password" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required></label>
        </div>
        <button type="submit">Create Scam Shield account</button>
        <div class="message" id="message" role="status"></div>
    </form>
    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    <p class="note">Local prototype: details are saved only in this browser. Do not use real sensitive information.</p>
</main>
<script>
document.getElementById('signup-form').addEventListener('submit', event => {
    event.preventDefault();
    const account = {
        name: document.getElementById('name').value.trim(),
        age: document.getElementById('age').value,
        mobile: document.getElementById('mobile').value.trim(),
        gender: document.getElementById('gender').value,
        address: document.getElementById('address').value.trim(),
        email: document.getElementById('email').value.trim().toLowerCase(),
        password: document.getElementById('password').value,
        identity: document.getElementById('email').value.trim().toLowerCase()
    };
    const accounts = JSON.parse(localStorage.getItem('scanShieldAccounts') || '[]');
    const message = document.getElementById('message');
    if (accounts.some(existing => existing.identity === account.identity || existing.mobile === account.mobile)) {
        message.textContent = 'An account with this email or mobile number already exists. Please log in.';
        message.classList.add('visible');
        return;
    }
    accounts.push(account);
    localStorage.setItem('scanShieldAccounts', JSON.stringify(accounts));
    localStorage.setItem('scanShieldSession', account.identity);
    window.location.href = 'scam.html';
});
</script>
</body>
</html>
